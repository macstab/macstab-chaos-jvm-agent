name: Publish Release

on:
  push:
    tags:
      - 'v*'

# CRITICAL: serialize release publishes - parallel runs corrupt artifacts.
concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Build provenance and the SBOM attestation are signed with the workflow's OIDC identity.
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Update version in gradle.properties
        run: |
          sed -i -E 's/^version *=.*/version = ${{ steps.version.outputs.VERSION }}/' gradle.properties
          grep -qx 'version = ${{ steps.version.outputs.VERSION }}' gradle.properties

      - name: Build and publish release to GitHub Packages (tests already ran pre-tag)
        run: ./gradlew publish --no-daemon --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Attest build provenance of every published jar
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'build/staging-deploy/**/*.jar'

      - name: Attest the agent jar's SBOM (it shades ByteBuddy and Jackson)
        uses: actions/attest-sbom@v2
        with:
          subject-path: 'build/staging-deploy/com/macstab/chaos/jvm/chaos-agent-bootstrap/${{ steps.version.outputs.VERSION }}/chaos-agent-bootstrap-${{ steps.version.outputs.VERSION }}.jar'
          sbom-path: 'build/staging-deploy/com/macstab/chaos/jvm/chaos-agent-bootstrap/${{ steps.version.outputs.VERSION }}/chaos-agent-bootstrap-${{ steps.version.outputs.VERSION }}-cyclonedx.json'
