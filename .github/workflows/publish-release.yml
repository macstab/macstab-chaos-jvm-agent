name: Publish Release

on:
  push:
    # semantic-release tags a release with its bare version (1.0.0): the tag format comes from the
    # release image's /configs/.releaserc-gradle.json (semantic-release.yml).
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# CRITICAL: serialize release publishes - parallel runs corrupt artifacts.
concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Build provenance and the SBOM attestation are signed with the workflow's OIDC identity.
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required reviewers and the signing secrets live on this environment.
    environment: release
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Update version in gradle.properties
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          sed -i -E "s/^version *=.*/version = ${VERSION}/" gradle.properties
          grep -qx "version = ${VERSION}" gradle.properties

      # The commit published is the commit checked: the version edit above is part of both.
      - name: Check and publish to GitHub Packages
        run: ./gradlew check publish --no-daemon --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          # In-memory signing key (ASCII-armoured) and its passphrase; see RELEASE.md.
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Attest build provenance of every published jar
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'build/staging-deploy/**/*.jar'

      - name: Attest the agent jar's SBOM (it shades ByteBuddy and Jackson)
        uses: actions/attest-sbom@v2
        with:
          subject-path: 'build/staging-deploy/com/macstab/chaos/jvm/chaos-agent-bootstrap/${{ steps.version.outputs.VERSION }}/chaos-agent-bootstrap-${{ steps.version.outputs.VERSION }}.jar'
          sbom-path: 'build/staging-deploy/com/macstab/chaos/jvm/chaos-agent-bootstrap/${{ steps.version.outputs.VERSION }}/chaos-agent-bootstrap-${{ steps.version.outputs.VERSION }}-cyclonedx.json'
