name: Mutation Tests

# PIT is too slow for every build (about 30 minutes, nearly all of it chaos-agent-core), so it runs
# weekly on develop and on demand. The pitest task of each module fails below its mutation floor
# (build.gradle.kts, mutationFloors), which fails this workflow.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pitest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        module: [chaos-agent-api, chaos-agent-startup-config, chaos-agent-core]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Mutation tests of ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:pitest --no-daemon --stacktrace

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/pitest/**
