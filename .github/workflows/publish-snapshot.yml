name: Publish SNAPSHOT

on:
  workflow_run:
    workflows: ["Build & Test"]
    types:
      - completed
    branches:
      - develop

# CRITICAL: serialize snapshot publishes - parallel runs corrupt artifacts.
concurrency:
  group: publish-snapshot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  packages: write
  contents: read

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    # Only a push to this repository's develop: a pull request from a fork can use a branch named
    # develop too, and its code must never run with the publishing token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          # The whole history and the tags: the SNAPSHOT version comes from the commits since the
          # last release.
          fetch-depth: 0

      - name: Verify correct commit
        run: |
          EXPECTED="${{ github.event.workflow_run.head_sha }}"
          ACTUAL=$(git rev-parse HEAD)
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "ERROR: wrong commit checked out (expected ${EXPECTED}, got ${ACTUAL})"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      # The version semantic-release would release from this commit, with -SNAPSHOT: not
      # gradle.properties, which stays at the last release until the next one, so a SNAPSHOT of it
      # would address the released packages. No commit that makes a release: no SNAPSHOT.
      - name: Work out the SNAPSHOT version
        id: next
        # Pinned by digest, as in semantic-release.yml.
        uses: docker://macstab/semantic-release-maven-gradle-nodejs-python-git-jq@sha256:9416a77355c013996df7bef6dd6825160b093bfca818337bf6a0a8797b6278f3 # 1.5.2-slim
        with:
          entrypoint: /bin/sh
          args: .github/scripts/snapshot-version.sh
        env:
          BRANCH: develop
          CONFIG_FILE: .releaserc-gradle.json

      - name: Check the version
        id: version
        if: steps.next.outputs.SNAPSHOT_VERSION != ''
        run: |
          VERSION="${{ steps.next.outputs.SNAPSHOT_VERSION }}"
          # The next step deletes the published packages of this version: never a release.
          case "${VERSION}" in
            *-SNAPSHOT) ;;
            *) echo "ERROR: ${VERSION} is not a SNAPSHOT version; refusing to replace it"; exit 1 ;;
          esac
          echo "PROJECT_VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Delete existing snapshot if present
        if: steps.version.outputs.PROJECT_VERSION != ''
        # The bot token deletes package versions; only this step holds it.
        env:
          BOT_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.PROJECT_VERSION }}"

          echo "=== Checking for existing snapshot artifacts ==="
          echo "Version to check: ${VERSION}"

          # Published Maven artifact coordinates (groupId.artifactId).
          # Benchmarks and examples are intentionally excluded.
          ARTIFACTS=(
            "com.macstab.chaos.jvm.chaos-agent-api"
            "com.macstab.chaos.jvm.chaos-agent-bom"
            "com.macstab.chaos.jvm.chaos-agent-bootstrap"
            "com.macstab.chaos.jvm.chaos-agent-core"
            "com.macstab.chaos.jvm.chaos-agent-instrumentation-jdk"
            "com.macstab.chaos.jvm.chaos-agent-micrometer"
            "com.macstab.chaos.jvm.chaos-agent-micronaut-integration"
            "com.macstab.chaos.jvm.chaos-agent-opentelemetry"
            "com.macstab.chaos.jvm.chaos-agent-quarkus-extension"
            "com.macstab.chaos.jvm.chaos-agent-quarkus-extension-deployment"
            "com.macstab.chaos.jvm.chaos-agent-quarkus-management"
            "com.macstab.chaos.jvm.chaos-agent-quarkus-management-deployment"
            "com.macstab.chaos.jvm.chaos-agent-spring-boot-common"
            "com.macstab.chaos.jvm.chaos-agent-spring-boot3-starter"
            "com.macstab.chaos.jvm.chaos-agent-spring-boot3-test-starter"
            "com.macstab.chaos.jvm.chaos-agent-spring-boot4-starter"
            "com.macstab.chaos.jvm.chaos-agent-spring-boot4-test-starter"
            "com.macstab.chaos.jvm.chaos-agent-startup-config"
            "com.macstab.chaos.jvm.chaos-agent-testkit"
          )

          DELETED_COUNT=0

          for PACKAGE_NAME in "${ARTIFACTS[@]}"; do
            echo ""
            echo "--- Checking artifact: ${PACKAGE_NAME} ---"

            PACKAGE_CHECK=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Bearer ${BOT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/macstab/packages/maven/${PACKAGE_NAME}")

            PACKAGE_HTTP_CODE=$(echo "$PACKAGE_CHECK" | tail -n1)

            if [ "$PACKAGE_HTTP_CODE" = "404" ]; then
              echo "  artifact does NOT exist yet (first publish)"
              continue
            elif [ "$PACKAGE_HTTP_CODE" != "200" ]; then
              echo "  ERROR: failed to check artifact existence (HTTP ${PACKAGE_HTTP_CODE})"
              exit 1
            fi

            if ! VERSIONS=$(curl -s -f -H "Authorization: Bearer ${BOT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/macstab/packages/maven/${PACKAGE_NAME}/versions?per_page=100"); then
              echo "  ERROR: failed to fetch versions"
              exit 1
            fi

            VERSION_ID=$(echo "$VERSIONS" | jq -r ".[] | select(.name == \"${VERSION}\") | .id")

            if [ -z "$VERSION_ID" ] || [ "$VERSION_ID" = "null" ]; then
              echo "  version ${VERSION} does NOT exist (nothing to delete)"
              continue
            fi

            echo "  version ${VERSION} exists (id=${VERSION_ID}) - deleting..."

            # GitHub refuses to delete a package's last version: when the SNAPSHOT is the only
            # version, the package itself goes (it holds nothing else).
            TARGET="https://api.github.com/orgs/macstab/packages/maven/${PACKAGE_NAME}/versions/${VERSION_ID}"
            if [ "$(echo "$VERSIONS" | jq 'length')" = "1" ]; then
              echo "  it is the package's only version - deleting the package"
              TARGET="https://api.github.com/orgs/macstab/packages/maven/${PACKAGE_NAME}"
            fi

            DELETE_RESULT=$(curl -s -w "\n%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${BOT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${TARGET}")

            HTTP_CODE=$(echo "$DELETE_RESULT" | tail -n1)

            if [ "$HTTP_CODE" = "204" ]; then
              echo "  deleted"
              DELETED_COUNT=$((DELETED_COUNT + 1))
            elif [ "$HTTP_CODE" = "404" ]; then
              echo "  already deleted (race condition, safe)"
            else
              echo "  ERROR: deletion failed (HTTP ${HTTP_CODE})"
              echo "$DELETE_RESULT"
              exit 1
            fi
          done

          echo ""
          echo "=== Cleanup complete: deleted ${DELETED_COUNT} artifact version(s) ==="

      - name: Publish SNAPSHOT to GitHub Packages (tests already ran in Build workflow)
        if: steps.version.outputs.PROJECT_VERSION != ''
        run: >
          ./gradlew publish -x test --no-daemon --stacktrace
          -Pversion=${{ steps.version.outputs.PROJECT_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
