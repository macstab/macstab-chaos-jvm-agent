name: Semantic Release

on:
  workflow_run:
    workflows: ["Build & Test"]
    types:
      - completed
    branches:
      - main

# CRITICAL: serialize semantic-release runs - parallel runs produce duplicate tags.
concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only a push to this repository's main: a pull request from a fork can use a branch named
    # main too, and its code must never run with the release token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify correct commit
        run: |
          EXPECTED="${{ github.event.workflow_run.head_sha }}"
          ACTUAL=$(git rev-parse HEAD)
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "ERROR: wrong commit checked out (expected ${EXPECTED}, got ${ACTUAL})"
            exit 1
          fi

      - name: Run semantic-release
        uses: docker://macstab/semantic-release-maven-gradle-nodejs-python-git-jq:1.5.2-slim
        if: github.ref == 'refs/heads/main'
        with:
          entrypoint: /bin/sh
          workdir: /home/runner/work/${{ github.repository }}/${{ github.repository }}
          args: -c "pwd && cp /configs/$CONFIG_FILE .releaserc && git config --global --add safe.directory $GITHUB_WORKSPACE && npx semantic-release --branches $RELEASE_BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_ENV: production
          GH_URL: https://github.com/${{ github.repository }}.git
          RELEASE_BRANCH: main
          CONFIG_FILE: .releaserc-gradle.json
          DEBUG: semantic-release:*

      - name: Merge main -> develop
        uses: docker://macstab/semantic-release-maven-gradle-nodejs-python-git-jq:1.5.2-slim
        if: ${{!startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          entrypoint: /bin/sh
          workdir: /home/runner/work/${{ github.repository }}/${{ github.repository }}
          # Only a release commit (tagged HEAD of main) goes back to develop; a conflict fails the job.
          args: "-c \"git config --global --add safe.directory $GITHUB_WORKSPACE && git config --global user.email '${{ secrets.BOT_USER_EMAIL }}' && git config --global user.name '${{ secrets.BOT_USER_NAME }}' && git remote set-url origin https://$GH_USERNAME:$GH_PASSWORD@github.com/${{ github.repository }}.git && git fetch --all --tags && git checkout ${INPUT_FROM_BRANCH} && git pull origin ${INPUT_FROM_BRANCH} && { TAG_NAME=`git describe --exact-match --tags HEAD 2>/dev/null` || { echo No release on HEAD; exit 0; }; } && echo Release tag is $TAG_NAME && COMMIT_HASH=`git rev-parse HEAD` && git checkout ${INPUT_TARGET_BRANCH} && git pull origin ${INPUT_TARGET_BRANCH} && git cherry-pick -Xtheirs --allow-empty $COMMIT_HASH && git push origin ${INPUT_TARGET_BRANCH}\""
        env:
          INPUT_FROM_BRANCH: 'main'
          INPUT_TARGET_BRANCH: 'develop'
          GH_USERNAME: ${{ secrets.BOT_USER_NAME }}
          GH_PASSWORD: ${{ secrets.BOT_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
