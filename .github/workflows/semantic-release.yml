name: Semantic Release

on:
  workflow_run:
    workflows: ["Build & Test"]
    types:
      - completed
    branches:
      - main

# CRITICAL: serialize semantic-release runs - parallel runs produce duplicate tags.
concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only a push to this repository's main: a pull request from a fork can use a branch named
    # main too, and its code must never run with the release token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify correct commit
        run: |
          EXPECTED="${{ github.event.workflow_run.head_sha }}"
          ACTUAL=$(git rev-parse HEAD)
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "ERROR: wrong commit checked out (expected ${EXPECTED}, got ${ACTUAL})"
            exit 1
          fi

      - name: Run semantic-release
        # Pinned by digest: a re-pushed tag cannot change what runs with the release token.
        uses: docker://macstab/semantic-release-maven-gradle-nodejs-python-git-jq@sha256:9416a77355c013996df7bef6dd6825160b093bfca818337bf6a0a8797b6278f3 # 1.5.2-slim
        if: github.ref == 'refs/heads/main'
        with:
          entrypoint: /bin/sh
          workdir: /home/runner/work/${{ github.repository }}/${{ github.repository }}
          args: -c "pwd && cp /configs/$CONFIG_FILE .releaserc && git config --global --add safe.directory $GITHUB_WORKSPACE && npx semantic-release --branches $RELEASE_BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_ENV: production
          GH_URL: https://github.com/${{ github.repository }}.git
          RELEASE_BRANCH: main
          CONFIG_FILE: .releaserc-gradle.json
          DEBUG: semantic-release:*

      - name: Merge the release back into develop
        uses: docker://macstab/semantic-release-maven-gradle-nodejs-python-git-jq@sha256:9416a77355c013996df7bef6dd6825160b093bfca818337bf6a0a8797b6278f3 # 1.5.2-slim
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          entrypoint: /bin/sh
          workdir: /home/runner/work/${{ github.repository }}/${{ github.repository }}
          # A release commit (tagged HEAD of main) is merged; develop keeps its gradle.properties
          # (its -SNAPSHOT version), and any other conflict fails the job.
          args: .github/scripts/back-merge.sh
        env:
          FROM_BRANCH: 'main'
          TARGET_BRANCH: 'develop'
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          BOT_USER_NAME: ${{ secrets.BOT_USER_NAME }}
          BOT_USER_EMAIL: ${{ secrets.BOT_USER_EMAIL }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
