name: Build & Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, feat/**]

# Deduplication by commit SHA: same commit runs once, duplicates are skipped.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung test otherwise holds the runner for GitHub's 6-hour default.
    timeout-minutes: 30
    if: |
      github.event_name != 'pull_request' && github.event.pull_request == null

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check code formatting
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Build with Gradle (includes tests)
        run: ./gradlew build jacocoAggregatedReport --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'

      - name: Upload jacoco coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: |
            build/reports/jacoco/aggregated/**
            **/build/reports/jacoco/test/html/**
            **/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: '**/build/libs/*.jar'

  # The agent rewrites JDK classes whose internals differ between releases (Thread.sleep,
  # LockSupport, virtual-thread mounting, FileChannelImpl) and between CPU architectures, so the
  # tests run on every supported JDK on amd64 and arm64. Compilation stays on the JDK 25 toolchain
  # (--release 21); -PtestJavaVersion only switches the JVM the tests run on.
  jdk-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: |
      github.event_name != 'pull_request' && github.event.pull_request == null
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        java: [21, 25]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }} and the JDK 25 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            ${{ matrix.java }}
            25
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test on JDK ${{ matrix.java }}
        run: >
          ./gradlew test --no-daemon --stacktrace
          -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_21_ARM64,JAVA_HOME_25_ARM64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-jdk${{ matrix.java }}
          path: '**/build/test-results/**/*.xml'

  # The native library's docs/DSL.md names this agent's API; the doc-sync test fails when a JVM
  # name there does not exist here, or a JSON example does not parse.
  cross-layer-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'pull_request' && github.event.pull_request == null

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout the native library's documentation
        uses: actions/checkout@v4
        with:
          repository: macstab/macstab-chaos-testing-libraries
          ref: develop
          path: native-library
          sparse-checkout: docs

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Check the cross-layer documentation
        env:
          CHAOS_DSL_PATH: ${{ github.workspace }}/native-library/docs/DSL.md
        run: |
          chmod +x gradlew
          ./gradlew :chaos-agent-startup-config:test --tests '*CrossLayerDocSyncTest*' --no-daemon

  # One-fault demos (demo/NN-*/): each runs under the agent and must print its expected output.
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name != 'pull_request' && github.event.pull_request == null

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Build the agent jar
        run: |
          chmod +x gradlew
          ./gradlew :chaos-agent-bootstrap:shadowJar --no-daemon

      - name: Run the demos
        run: demo/run-all.sh
