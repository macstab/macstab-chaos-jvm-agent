name: Build & Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

# One run per branch or pull request: a newer push supersedes the older run. A pull request
# (refs/pull/N/merge) never cancels the push build of its target branch, which the snapshot and
# release workflows wait for.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung test otherwise holds the runner for GitHub's 6-hour default.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Check code formatting
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Build with Gradle (includes tests)
        run: ./gradlew build jacocoAggregatedReport --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'

      - name: Upload jacoco coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: |
            build/reports/jacoco/aggregated/**
            **/build/reports/jacoco/test/html/**
            **/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: '**/build/libs/*.jar'

  # The agent rewrites JDK classes whose internals differ between releases (Thread.sleep,
  # LockSupport, virtual-thread mounting, FileChannelImpl) and between CPU architectures, so the
  # tests run on every supported JDK on amd64 and arm64. Compilation stays on the JDK 25 toolchain
  # (--release 21); -PtestJavaVersion only switches the JVM the tests run on.
  jdk-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        java: [21, 25]
        exclude:
          # The build job already runs the tests on JDK 25 on amd64.
          - os: ubuntu-latest
            java: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }} and the JDK 25 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            ${{ matrix.java }}
            25
          cache: 'gradle'

      - name: Test on JDK ${{ matrix.java }}
        run: >
          ./gradlew test --no-daemon --stacktrace
          -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_21_ARM64,JAVA_HOME_25_ARM64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-jdk${{ matrix.java }}
          path: '**/build/test-results/**/*.xml'

  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Build the agent jar
        run: ./gradlew :chaos-agent-bootstrap:shadowJar --no-daemon

      - name: Run the demos
        run: demo/run-all.sh
