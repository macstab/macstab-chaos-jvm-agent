name: Benchmark Gate

# Release-over-release performance gate: the dispatch benchmarks of the pull request are compared
# with those of the target branch (the last release on main), both measured on the same runner.
# See scripts/jmh-gate.py for the regression rule.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: benchmark-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Dispatch-path benchmarks only; the full suite is for local investigation.
      BENCHMARKS: BridgeDispatchBenchmark
      JMH_ARGS: -f 3 -wi 3 -i 5 -w 1s -r 1s -rf json

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref || 'main' }}
          path: base

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
          cache-dependency-path: candidate/**/*.gradle.kts

      - name: Build benchmarks
        run: |
          for tree in base candidate; do
            (cd "$tree" && chmod +x gradlew && ./gradlew :chaos-agent-benchmarks:installDist --no-daemon -q)
          done

      - name: Run base
        run: |
          bench=base/chaos-agent-benchmarks/build/install/chaos-agent-benchmarks/bin/chaos-agent-benchmarks
          if "$bench" -l | grep -q "$BENCHMARKS"; then
            "$bench" $BENCHMARKS $JMH_ARGS -rff "$PWD/base.json"
          else
            echo "base has no $BENCHMARKS yet; the gate will pass"
          fi

      - name: Run candidate
        run: |
          candidate/chaos-agent-benchmarks/build/install/chaos-agent-benchmarks/bin/chaos-agent-benchmarks \
            $BENCHMARKS $JMH_ARGS -rff "$PWD/candidate.json"

      - name: Compare
        run: python3 candidate/scripts/jmh-gate.py base.json candidate.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: '*.json'
