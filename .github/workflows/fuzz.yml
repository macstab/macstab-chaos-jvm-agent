name: Plan Fuzzing

# A long run of PlanFuzzTest with a fresh seed every night. The build runs it with a fixed seed;
# this run explores new inputs. A failure prints the seed: replay it locally with
#   ./gradlew :chaos-agent-bootstrap:test --tests '*PlanFuzzTest*' \
#     -PfuzzSeed=<seed> -PfuzzIterations=<iterations>
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Inputs per fuzz source'
        default: '200000'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUZZ_SEED: ${{ github.run_id }}
      FUZZ_ITERATIONS: ${{ github.event.inputs.iterations || '200000' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Fuzz the plan parser and validator
        run: |
          echo "seed ${FUZZ_SEED}, ${FUZZ_ITERATIONS} inputs per source"
          ./gradlew :chaos-agent-bootstrap:test --no-daemon --tests '*PlanFuzzTest*' \
            -PfuzzSeed="${FUZZ_SEED}" -PfuzzIterations="${FUZZ_ITERATIONS}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results-${{ github.run_id }}
          path: 'chaos-agent-bootstrap/build/test-results/**/*.xml'
