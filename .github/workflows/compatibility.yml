name: Compatibility

# The platforms and JDKs the gating build does not cover: macOS, Windows and the JDK releases
# between the supported LTS versions. Not a gate yet: it runs weekly and on demand, and a platform
# moves into the build's matrix once it is green there.
on:
  schedule:
    - cron: '23 2 * * 0'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, java: 21 }
          - { os: macos-latest, java: 25 }
          - { os: windows-latest, java: 21 }
          - { os: windows-latest, java: 25 }
          - { os: ubuntu-latest, java: 22 }
          - { os: ubuntu-latest, java: 23 }
          - { os: ubuntu-latest, java: 24 }
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }} and the JDK 25 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            ${{ matrix.java }}
            25
          cache: 'gradle'
      - name: Test on JDK ${{ matrix.java }}
        shell: bash
        run: >
          ./gradlew test --no-daemon --stacktrace
          -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64,JAVA_HOME_25_X64,JAVA_HOME_${{ matrix.java }}_ARM64,JAVA_HOME_25_ARM64
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.os }}-jdk${{ matrix.java }}
          path: '**/build/test-results/**/*.xml'

  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build every jar twice and compare
        run: scripts/check-reproducible.sh
