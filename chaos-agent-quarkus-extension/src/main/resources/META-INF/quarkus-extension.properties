# Read by Quarkus bootstrap to locate the deployment (build-time) module of this extension.
deployment-artifact=${group}:chaos-agent-quarkus-extension-deployment:${version}
# The api and the agent are loaded parent-first (in the packaged application from lib/boot, by the
# system class loader): one copy per JVM, shared with a -javaagent agent and with the test
# extensions. Not the extension itself, which needs Quarkus's own class loader.
parent-first-artifacts=${group}:chaos-agent-api,${group}:chaos-agent-bootstrap
runner-parent-first-artifacts=${group}:chaos-agent-api,${group}:chaos-agent-bootstrap
