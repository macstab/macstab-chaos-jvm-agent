# The agent attaches at runtime-init; /q/chaos is mounted and, for this example only, open to
# anonymous callers (secure it with quarkus.http.auth.permission in an application).
macstab.chaos.enabled=true
macstab.chaos.management.enabled=true
macstab.chaos.management.allow-anonymous=true
quarkus.http.test-port=0
# This build has no Quarkus platform properties (the Gradle plugin is not used): name the native
# builder image the configuration validation expands.
quarkus.native.builder-image=mandrel
